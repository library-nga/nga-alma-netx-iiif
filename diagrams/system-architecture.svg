<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
    <style>
      .box{fill:#fff;stroke-width:2}.title{font:700 24px Arial,sans-serif}.sub{font:italic 16px Arial,sans-serif}.txt{font:16px Arial,sans-serif}.purple{stroke:#5630a5}.green{stroke:#169447}.orange{stroke:#e78313}.red{stroke:#e43d24}.line{stroke:#222;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#222;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
    <g id="iiifLogo">
      <circle cx="7" cy="7" r="4" fill="#1498b7"/><rect x="3" y="13" width="8" height="27" rx="1" fill="#1498b7"/>
      <circle cx="18" cy="7" r="4" fill="#e74b3c"/><rect x="14" y="13" width="8" height="27" rx="1" fill="#e74b3c"/>
      <circle cx="29" cy="7" r="4" fill="#1498b7"/><rect x="25" y="13" width="8" height="27" rx="1" fill="#1498b7"/>
      <path d="M38 8 H51 V15 H45 V21 H51 V28 H45 V40 H37 V8 Z" fill="#e74b3c"/>
    </g>
    <g id="clarivateIcon">
