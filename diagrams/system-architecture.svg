  <text x="552" y="472" font-family="Arial" font-size="34" font-weight="bold" fill="#152a42">Net<tspan fill="#52a641">X</tspan></text>
  <text class="title" x="716" y="464" text-anchor="middle" fill="#d9760d">NetX/eDAM</text>
  <text class="txt" x="575" y="502">• Asset repository</text>
