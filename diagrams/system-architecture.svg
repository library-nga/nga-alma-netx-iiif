      <path d="M38 16 A20 20 0 0 1 33 35" fill="none" stroke="#10a83e" stroke-width="9"/>
      <path d="M33 35 A20 20 0 0 1 12 38" fill="none" stroke="#111" stroke-width="9"/>
      <path d="M12 38 A20 20 0 0 1 6 18" fill="none" stroke="#111" stroke-width="9"/>
