  <g transform="translate(597 350)"><use href="#apiIcon"/></g>
  <text class="title" x="690" y="372" text-anchor="middle" fill="#e78313" font-size="19">NetX API</text>
  <path class="line" d="M680 390 V417"/>

  <rect class="box green" x="70" y="420" width="300" height="190" rx="12"/>
  <g transform="translate(90 442) scale(.95)"><use href="#clarivateIcon"/></g>
