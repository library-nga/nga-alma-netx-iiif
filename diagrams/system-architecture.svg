<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
    <style>
      .box{fill:#fff;stroke-width:2;rx:12}.title{font:700 24px Arial,sans-serif}.sub{font:italic 16px Arial,sans-serif}.txt{font:16px Arial,sans-serif}.small{font:14px Arial,sans-serif}.purple{stroke:#5630a5}.green{stroke:#169447}.orange{stroke:#e78313}.red{stroke:#e43d24}.blue{stroke:#236ac5}.line{stroke:#222;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#222;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="900" height="720" fill="white"/>
  <!-- Primo -->
  <rect class="box purple" x="250" y="18" width="400" height="76"/>
  <circle cx="292" cy="56" r="22" fill="none" stroke="#5630a5" stroke-width="9" stroke-dasharray="28 12" transform="rotate(-30 292 56)"/>
  <text class="title" x="450" y="51" text-anchor="middle" fill="#4c27a1">Primo VE</text><text class="sub" x="450" y="76" text-anchor="middle">Discovery / Viewer</text>
  <path class="line" d="M450 94 V124"/>
  <!-- Viewer -->
  <rect class="box purple" x="250" y="125" width="400" height="62"/>
  <text x="285" y="165" font-family="Arial" font-size="26" font-weight="bold" fill="#e13b32">IIIF</text>
  <text class="title" x="470" y="165" text-anchor="middle" font-size="21">Custom IIIF Viewer</text>
  <path class="line" d="M450 187 V217"/>
  <!-- Manifest -->
  <rect class="box purple" x="250" y="218" width="400" height="76"/>
  <text x="282" y="259" font-family="Arial" font-size="26" font-weight="bold" fill="#e13b32">IIIF</text>
  <text class="title" x="470" y="250" text-anchor="middle" fill="#5630a5">IIIF Manifest</text><text class="txt" x="470" y="277" text-anchor="middle">libraryimage.nga.gov/manifest</text>
  <!-- branches -->
  <path class="line" d="M450 294 V320 H220 V348"/><path class="line" d="M450 320 H680 V348"/>
  <!-- Alma -->
  <rect class="box green" x="70" y="350" width="300" height="190"/>
  <circle cx="112" cy="395" r="22" fill="none" stroke="#5630a5" stroke-width="9" stroke-dasharray="28 12" transform="rotate(-30 112 395)"/>
  <text class="title" x="220" y="394" text-anchor="middle" fill="#169447">Alma</text>
  <text class="txt" x="112" y="432">• Remote Digital Repository</text><text class="txt" x="112" y="460">• Digital Representation</text><text class="txt" x="112" y="488">• Collection hierarchy</text>
  <!-- NetX -->
  <rect class="box orange" x="530" y="350" width="300" height="190"/>
  <text x="565" y="402" font-family="Arial" font-size="34" font-weight="bold" fill="#152a42">Net<tspan fill="#52a641">X</tspan></text><text class="title" x="710" y="394" text-anchor="middle" fill="#d9760d">NetX/eDAM</text>
  <text class="txt" x="575" y="432">• Asset repository</text><text class="txt" x="575" y="460">• Metadata + images</text><text class="txt" x="575" y="488">• Web publishing</text>
  <path class="dash" d="M370 445 H530"/><path class="dash" d="M530 457 H370"/>
  <!-- API -->
  <path class="line" d="M680 540 V566"/><rect class="box orange" x="570" y="568" width="220" height="46"/><text class="txt" x="680" y="597" text-anchor="middle" font-weight="bold">custom NetX API</text>
  <path class="line" d="M680 614 V637"/>
  <rect class="box red" x="530" y="638" width="300" height="68"/><text x="555" y="681" font-family="Arial" font-size="25" font-weight="bold" fill="#e13b32">IIIF</text><text class="title" x="690" y="668" text-anchor="middle" fill="#e43d24" font-size="21">IIIF Image API</text><text class="txt" x="690" y="693" text-anchor="middle">api.nga.gov/UUID</text>
  <!-- delivery connection -->
  <path d="M530 674 H420 V620 H220 V540" stroke="#222" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect class="box blue" x="270" y="588" width="220" height="78"/><text class="txt" x="380" y="617" text-anchor="middle" font-weight="bold" fill="#236ac5">IIIF Image delivery</text><text class="small" x="380" y="640" text-anchor="middle">images served to viewer</text><text class="small" x="380" y="659" text-anchor="middle">via IIIF Image API</text>
</svg>