  <rect x="650" y="585" width="60" height="16" fill="#f29900" stroke="#c86d00"/>
  <ellipse cx="680" cy="601" rx="30" ry="9" fill="#f29900" stroke="#c86d00"/>

  <path class="dash" d="M370 515 H530"/>
  <path class="dash" d="M530 527 H370"/>

  <path class="line" d="M680 610 V632"/>
  <rect class="box orange" x="570" y="634" width="220" height="46" rx="10"/>
  <g transform="translate(588 643)"><use href="#apiIcon"/></g>
  <text class="txt" x="690" y="663" text-anchor="middle" font-weight="bold">custom NetX API</text>
  <path class="line" d="M680 680 V700"/>

  <rect class="box red" x="530" y="702" width="300" height="50" rx="12"/>
  <g transform="translate(550 707) scale(.75)"><use href="#iiifLogo"/></g>
  <text class="title" x="704" y="724" text-anchor="middle" fill="#e43d24" font-size="20">IIIF Image API</text>
  <text class="txt" x="704" y="745" text-anchor="middle">api.nga.gov/UUID</text>
