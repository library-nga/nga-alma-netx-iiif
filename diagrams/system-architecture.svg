    <g id="apiIcon"><circle cx="14" cy="14" r="10" fill="none" stroke="#111" stroke-width="5" stroke-dasharray="5 3"/></g>
  </defs>
  <rect width="900" height="760" fill="white"/>

  <rect class="box purple" x="250" y="18" width="400" height="76" rx="12"/>
  <g transform="translate(272 36) scale(.9)"><use href="#clarivateIcon"/></g>
  <text class="title" x="465" y="51" text-anchor="middle" fill="#4c27a1">Primo VE</text>
  <text class="sub" x="465" y="76" text-anchor="middle">Discovery / Viewer</text>
  <path class="line" d="M450 94 V124"/>

  <rect class="box purple" x="250" y="125" width="400" height="62" rx="12"/>
  <g transform="translate(282 137) scale(.82)"><use href="#iiifLogo"/></g>
